name: Bug report
description: Report a problem with the Expert Builder skill, templates, or docs
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Please fill in the sections below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: When I invoked the expert-builder skill to build an expert on X, ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Launch the harness in ...
        2. Invoke ...
        3. See ...
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
      description: Which harness did you use (e.g. Copilot CLI) and which version?
      placeholder: Copilot CLI vX.Y.Z
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps, such as the affected file path.
    validations:
      required: false
